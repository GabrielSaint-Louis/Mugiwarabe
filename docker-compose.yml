# Toute la stack en un fichier. Remplace, a elle seule, les six etapes manuelles
# du chapitre 6 : docker network create, docker volume create, docker inspect
# pour lire une IP, une modification du code, un build et deux docker run.
#
#   docker compose up -d      demarre tout
#   docker compose ps         etat des services
#   docker compose down       arrete et supprime (le volume, lui, survit)
#
# Zero valeur en dur ici : tout vient du .env, qui n'est pas commite.
name: todo

services:
  # --- Base de donnees --------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Volume nomme : les donnees survivent a `docker compose down`, et meme a
      # la suppression complete du conteneur.
      - pgdata:/var/lib/postgresql/data
    networks:
      - todo-network
    # Pas de `ports:` — c'est volontaire et c'est tout l'interet du network
    # custom. La base est joignable par les autres conteneurs, par personne
    # d'autre. Publier 5432 ici ouvrirait la base a tout process de la machine.
    healthcheck:
      # `depends_on: service_healthy` cote API s'appuie sur cette sonde. Sans
      # elle, l'API demarrerait pendant l'initdb de Postgres et echouerait a se
      # connecter : "demarre" ne veut pas dire "pret a repondre".
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- API Node.js ------------------------------------------------------------
  todo-api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Pas sensible, donc lisible directement dans le fichier commite. Les
      # secrets, eux, restent dans le .env charge juste au-dessus.
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      # hote:conteneur. Le port hote est configurable, le port interne ne bouge
      # jamais : c'est celui que le Dockerfile declare en EXPOSE.
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  # --- Service Python de statistiques -----------------------------------------
  stats-api:
    build: ./stats_api
    restart: unless-stopped
    # Meme .env que todo-api : les deux services lisent la meme base, donc la
    # meme configuration, avec les memes cles DB_*. C'est ce qui permet au code
    # Python de fonctionner sans qu'on y touche.
    env_file:
      - .env
    ports:
      - '${STATS_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  # --- Interface d'admin de la base -------------------------------------------
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    environment:
      # Pre-remplit le champ "serveur" du formulaire de connexion.
      ADMINER_DEFAULT_SERVER: ${DB_HOST}
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

networks:
  todo-network:
    # `name:` fige le nom reel du network. Sans lui, Compose le prefixerait du
    # nom du projet (todo_todo-network).
    name: todo-network

volumes:
  # Cle `pgdata` + nom de projet `todo` => volume reel `todo_pgdata`.
  pgdata:
