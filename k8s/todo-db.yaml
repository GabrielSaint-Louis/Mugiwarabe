# La base et son volume. Trois objets dans un seul fichier, separes par ---,
# parce qu'ils n'ont aucun sens l'un sans les autres : le Deployment sans PVC
# perd tout au premier redemarrage, la PVC sans Service n'est joignable par
# personne.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-db-data
  namespace: todo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Aucun storageClassName : k3d fournit local-path par defaut, qui provisionne
  # le volume sur le disque du noeud sans qu'on ait rien a installer.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-db
  namespace: todo
spec:
  replicas: 1 # une base ne se duplique pas comme un service sans etat
  selector:
    matchLabels:
      app: todo-db
  template:
    metadata:
      labels:
        app: todo-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            # secretKeyRef et pas envFrom : l'image postgres attend ces trois
            # noms-la exactement, POSTGRES_*, la ou l'API attend DB_*. Une seule
            # source de verite, le Secret, deux facons de la lire.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          # ATTENTION : CES VALEURS NE SE MESURENT PAS COMME CELLES DE L'API.
          #
          # La methode de la phase 12 — serrer jusqu'a l'OOMKilled, revenir d'un
          # cran — donne ici une valeur mortelle, et le 6 aout 2026 l'a montre
          # en trois etapes :
          #
          #   1. kubectl top mesure 23 a 29 Mi, au repos comme sous quatre
          #      generateurs de charge en parallele.
          #   2. limits.memory: 64Mi, soit plus du double du pic mesure :
          #      169 requetes HTTP, 0 echec, pod 1/1. La mesure approuve.
          #   3. UNE SEULE requete un peu gourmande, le genre qu'un endpoint de
          #      statistiques ecrit sans y penser
          #      (SELECT array_agg(g) FROM generate_series(1,4000000) g) :
          #      OOMKilled, Exit Code 137, la base emportee.
          #
          # Pourquoi la mesure ment ici et pas sur l'API : Postgres RESERVE
          # 128 MiB de shared_buffers au demarrage (16384 * 8kB, lu dans
          # pg_settings) mais n'en touche presque rien tant que la charge reste
          # legere. La memoire residente d'une base au repos ne dit donc rien de
          # ce dont elle a besoin le jour ou elle travaille.
          #
          # Le bon chiffre vient de la configuration, pas de l'observation :
          #   shared_buffers        128 MiB   reserves au demarrage
          #   maintenance_work_mem   64 MiB   pendant un VACUUM ou un REINDEX
          #   work_mem                4 MiB   par operation de tri, par connexion
          #   + le binaire et ses tables systeme
          #
          # requests = 160Mi : ce que la base tient reellement en permanence,
          # shared_buffers compris. C'est ce que le scheduler reserve.
          # limits = 256Mi : de quoi encaisser un VACUUM pendant que des
          # connexions trient. La meme requete qui tuait le pod a 64Mi rend son
          # resultat sans incident a cette valeur.
          resources:
            requests:
              memory: 160Mi
              cpu: 50m
            limits:
              memory: 256Mi
              # Comme pour l'API : une limite CPU ralentit, elle ne tue pas.
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              # subPath evite un dossier "lost+found" que certains volumes
              # deposent a la racine, et que Postgres refuse au demarrage
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: todo-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: todo-db
  namespace: todo
spec:
  # Le nom de ce Service est la valeur de DB_HOST dans todo-config. C'est le
  # DNS interne qui fait le lien, aucune IP n'est ecrite nulle part.
  selector:
    app: todo-db
  ports:
    - port: 5432
      targetPort: 5432
