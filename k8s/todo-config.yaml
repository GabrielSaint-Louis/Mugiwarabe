# Ce qui n'est pas sensible, et qui change d'un environnement a l'autre. La
# meme image tourne desormais contre n'importe quelle base sans etre
# reconstruite : c'est ce fichier qui decide, pas le Dockerfile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: todo
data:
  # DB_HOST vaut le NOM DU SERVICE PostgreSQL (phase 3), ni une IP ni
  # localhost : le DNS interne du cluster le resout vers les pods qui portent
  # l'etiquette app: todo-db, quel que soit leur nombre ou leur IP du moment.
  # Meme principe qu'au jour 1 avec le nom de service du docker-compose.
  DB_HOST: "todo-db"
  DB_PORT: "5432"
  NODE_ENV: "production"
  # Le port d'ecoute DANS le conteneur. Il doit coller au containerPort du
  # Deployment et au targetPort du Service, sinon le Service route vers le vide.
  PORT: "3000"
