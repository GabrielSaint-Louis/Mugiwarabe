# Template du Secret — CE fichier est commite, k8s/todo-secret.yaml ne l'est
# jamais. Meme discipline qu'entre .env.example et .env depuis le jour 1, pour
# la meme raison : un mot de passe pousse par erreur reste dans l'historique,
# et `git log -p` le retrouve.
#
#   cp k8s/todo-secret.example.yaml k8s/todo-secret.yaml
#   # renseigner les trois valeurs, puis :
#   kubectl apply -f k8s/todo-secret.yaml
#
# `stringData` plutot que `data` : Kubernetes accepte du texte en clair et
# l'encode lui-meme en base64 au moment de l'enregistrer. A la relecture,
# `kubectl get secret -o yaml` reaffiche du base64 — qui n'est PAS du
# chiffrement, seulement un encodage. Un Secret protege de la lecture
# accidentelle, pas d'un acces au cluster.
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
type: Opaque
stringData:
  # Les trois valeurs que src/config.js exige au demarrage via required(),
  # plus DB_NAME que le pod PostgreSQL de la phase 3 lit pour creer sa base.
  DB_NAME: "todo_db"
  DB_USER: "todo_user"
  DB_PASSWORD: "REMPLACER_PAR_UN_VRAI_MOT_DE_PASSE"
