# La surveillance sur le cluster.
#
# Le changement qui compte n'est pas le passage en manifeste, c'est la facon dont
# Prometheus trouve ses cibles. Sur le compose, on lui donnait quatre noms de
# service ecrits a la main. Ici, il les DECOUVRE : il interroge l'API de
# Kubernetes et prend tous les pods portant l'annotation qui va bien.
#
# La difference se voit au premier passage a l'echelle. Trois exemplaires du
# front deviennent trois cibles sans qu'on touche a la configuration, la ou la
# liste ecrite a la main serait restee a un.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mugiwarabe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: mugiwarabe
rules:
  # Le minimum : lire les pods de son propre espace de noms. Pas de ClusterRole,
  # pas d'acces aux secrets, pas de droits sur le reste du cluster.
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: mugiwarabe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mugiwarabe
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: mugiwarabe
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 3s
    scrape_configs:
      - job_name: flotte
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [mugiwarabe]
        relabel_configs:
          # On ne garde que les pods de la flotte, et on jette tout le reste :
          # sans ce filtre, Prometheus tenterait de scraper Prometheus lui-meme
          # sur /metriques et remplirait les logs d'erreurs.
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (front|api|classement|vigie)
            action: keep
          # Le nom du pod devient l'instance, le label app devient le service.
          # C'est ce qui permet aux quatre panneaux ecrits pour le compose de
          # fonctionner sans etre reecrits.
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - target_label: __metrics_path__
            replacement: /metriques
          - source_labels: [__address__]
            regex: (.+?)(?::\d+)?
            target_label: __address__
            replacement: ${1}:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mugiwarabe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=2h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mugiwarabe
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
