# L'etat voulu de l'API, ecrit une fois, maintenu en continu par le cluster.
# Ce fichier remplace les trois `docker stop/rm/run` du jour 3 : ceux-la
# s'executaient une fois, celui-ci reste vrai apres coup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
spec:
  # Trois copies, pas une. Une seule encaissait tout le trafic seule et tombait
  # avec lui. Le Service n'a pas eu a changer d'un caractere : son selector
  # retrouve les nouveaux pods par leur etiquette, pas par leur nom.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 est LA ligne qui supprime la coupure d'hier : aucun
      # ancien pod ne part avant qu'un nouveau soit Ready au sens de la
      # readinessProbe. La capacite de service ne descend jamais sous 3.
      maxUnavailable: 0
      # Le prix a payer : une copie de plus le temps de la transition, donc
      # 4 pods au pic au lieu de 3. maxSurge: 0 avec maxUnavailable: 0 serait
      # refuse — les deux a zero interdisent tout mouvement.
      maxSurge: 1
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        # Cette etiquette est le seul lien entre le Deployment et le Service :
        # aucun des deux ne connait le nom des pods, qui change a chaque rollout.
        app: todo-api
      annotations:
        # C'est le pod qui declare qu'il veut etre scrute, pas Prometheus qui
        # tient une liste. Le prometheus.yml du jour 3 nommait sa cible en dur
        # (`targets: ['todo-api:3000']`) : il aurait fallu l'editer a chaque
        # nouvelle application. Ici, ces trois lignes suffisent, et un pod
        # supprime disparait des cibles tout seul.
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # 30s, largement au-dessus des 5s du preStop plus le temps de fermeture
      # du serveur : le pod n'est jamais SIGKILL avant d'avoir fini de servir.
      terminationGracePeriodSeconds: 30
      # Trois copies posees sur le meme noeud protegent d'un pod qui meurt, pas
      # d'une machine qui s'arrete. Cette contrainte les repartit sur les noeuds
      # disponibles : 2 et 1 sur un cluster a deux noeuds.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: todo-api
          # ScheduleAnyway et pas DoNotSchedule, et c'est un choix, pas une
          # facilite. En DoNotSchedule, un noeud indisponible — precisement le
          # cas contre lequel cette contrainte existe — empecherait le pod de
          # se placer ailleurs, et le rollout resterait bloque. La repartition
          # est une preference forte, jamais une condition de demarrage.
          whenUnsatisfiable: ScheduleAnyway
      containers:
        - name: todo-api
          # Le tag est un sha de commit, jamais `latest` : c'est la meme regle
          # qu'au jour 3, et c'est ce qui rend `rollout undo` capable de nommer
          # exactement la version d'avant. La pipeline (phase 5) remplace cette
          # ligne par `kubectl set image` a chaque push sur main.
          image: ghcr.io/gabrielsaint-louis/todo-api:f692c37b8de454fa688576db5f0b21c69cf26f06
          ports:
            - containerPort: 3000
          # Le .env copie a la main sur vm-prod au jour 3 disparait ici. Les
          # deux objets sont deverses d'un coup dans l'environnement du
          # conteneur : l'API lit deja DB_HOST, DB_USER, DB_PASSWORD sous ces
          # noms exacts depuis le jour 1, rien a renommer.
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
          # Deux sondes, deux decisions differentes, et c'est tout l'interet de
          # les separer : l'une choisit qui recoit du trafic, l'autre choisit
          # qui redemarre. Les confondre donne soit un pod qui recoit avant
          # d'etre pret, soit un pod tue parce qu'il demarrait lentement.
          #
          # LIMITE CONNUE ET MESUREE (phase 7) : les deux interrogent /health,
          # qui repond ok sans jamais toucher la base. Base coupee, ce pod
          # reste READY 1/1 et continue de recevoir du trafic, pendant que
          # /api/tasks renvoie 500. Assume : un /health qui interrogerait la
          # base a chaque appel ferait echouer les trois sondes en meme temps
          # au premier ralentissement de Postgres, et transformerait une base
          # lente en trois pods tues.
          # Valeurs trouvees par l'echec, phase 12, pas par intuition.
          # Mesure au repos ET sous charge : 15 a 17 Mi, quel que soit le
          # nombre de generateurs (1 ou 4 en parallele, meme resultat).
          # Le plancher est entre 20Mi (OOMKilled au demarrage) et 24Mi (tenu,
          # rolling update sous charge compris, 0 requete perdue sur 382).
          #
          # 48Mi retenu, soit trois fois le pic mesure et le double du plancher
          # trouve. Pourquoi pas 24Mi, la valeur "juste au-dessus de la
          # casse" : elle tient sous la charge qu'on sait produire ici, pas
          # sous celle qu'on ne sait pas produire. Node reclame sa memoire par
          # a-coups au GC, et un corps de reponse plus gros que nos taches
          # deplacerait le pic sans prevenir. Le detail des paliers est au
          # Journal de bord.
          resources:
            requests:
              # Ce que le scheduler reserve au placement. Colle au pic mesure
              # plutot qu'a la limite : reserver 48Mi par pod ferait refuser
              # des pods que la machine aurait tres bien pu accueillir.
              memory: 24Mi
              cpu: 50m
            limits:
              memory: 48Mi
              # Une limite CPU ne tue pas, elle ralentit (throttling), a la
              # difference de la memoire qui declenche un OOMKill. 500m laisse
              # dix fois le CPU observe en pointe (41 a 48m) : assez large pour
              # ne jamais brider une rafale legitime, assez ferme pour qu'un pod
              # parti en boucle n'affame pas ses voisins.
              cpu: 500m
          # Ajoute APRES la premiere mesure de la phase 8, qui a compte 4
          # requetes perdues sur 311 malgre maxUnavailable: 0.
          #
          # La cause n'est pas le rolling update, elle est plus subtile :
          # Kubernetes envoie SIGTERM au pod AU MEME MOMENT qu'il retire son
          # endpoint du Service. Le code ferme alors son serveur tout de suite
          # (src/server.js), pendant que Traefik, lui, n'a pas encore appris
          # que ce pod ne doit plus recevoir de trafic. Les requetes envoyees
          # dans cet intervalle tombent sur un port ferme : code 502, ou 000
          # quand la connexion est coupee en cours.
          #
          # preStop retarde le SIGTERM de 5 secondes. Le pod continue de servir
          # normalement pendant que la nouvelle du retrait se propage. Aucune
          # ligne de code applicatif n'a eu a changer.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            # Court : l'API ecoute en moins d'une seconde, rien ne sert
            # d'attendre pour la mettre en service.
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            # Plus large que la readiness, exprès : cette sonde-la TUE le
            # conteneur. Un delai trop court sur un demarrage un peu lent
            # produit un pod qui redemarre en boucle sans qu'il ait rien.
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
