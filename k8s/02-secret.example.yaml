# LE MODELE, PAS LE VRAI.
#
# Le fichier reel s'appelle k8s/02-secret.yaml, il est dans .gitignore, et il ne
# doit jamais etre commite. Un `git log -p` qui ferait apparaitre un mot de passe,
# meme supprime depuis, compte comme une fuite.
#
#   cp k8s/02-secret.example.yaml k8s/02-secret.yaml
#   puis on remplit, et on applique.
apiVersion: v1
kind: Secret
metadata:
  name: flotte
  namespace: mugiwarabe
type: Opaque
# stringData et pas data : Kubernetes se charge de l'encodage. Ecrire du base64
# a la main dans un fichier de configuration n'apporte aucune securite, c'est un
# encodage et pas un chiffrement, et ca rend juste les erreurs invisibles.
stringData:
  DB_PASSWORD: remplacer-par-le-vrai
  GROQ_API_KEY: ""
