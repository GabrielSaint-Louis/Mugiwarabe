# Une adresse stable devant des pods qui, eux, ne le sont pas. Le jour 3, on
# ecrivait une IP relevee a la main dans un fichier ; ici, le nom `todo-api`
# suffit, et il continue de fonctionner quand les trois pods derriere ont ete
# remplaces.
apiVersion: v1
kind: Service
metadata:
  name: todo-api
  namespace: todo
spec:
  # ClusterIP : joignable depuis l'interieur du cluster seulement. L'exterieur
  # passera par l'Ingress de la phase 4, pas par ce Service.
  type: ClusterIP
  selector:
    app: todo-api
  ports:
    # 80 cote Service, 3000 cote conteneur : le port publie et le port d'ecoute
    # sont distincts exprès, exactement comme PORT et API_PORT au jour 2.
    - port: 80
      targetPort: 3000
