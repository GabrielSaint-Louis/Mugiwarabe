# Grafana, et les trois fichiers qui le decrivent entierement.
#
# Rien ne se clique ici : la source de donnees, le tableau de bord et les
# alertes viennent tous de ConfigMaps, eux-memes generes depuis le depot. Une
# modification faite a la souris est ecrasee au prochain demarrage — c'est
# voulu, et c'est la meme regle qu'au jour 3 : un panneau bricole en pleine
# astreinte ne doit pas survivre en silence.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: todo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Grafana n'y garde que sa base SQLite interne : historique des alertes,
      # preferences. Les tableaux de bord, eux, viennent des fichiers.
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    # Recreate, meme raison que Prometheus : la PVC est ReadWriteOnce.
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
      # Pas d'annotation prometheus.io/scrape ici : Grafana expose bien un
      # /metrics, mais surveiller l'outil de surveillance avec lui-meme ne dit
      # rien le jour ou il tombe. C'est le job `prometheus` qui joue ce role.
    spec:
      securityContext:
        # 472 est l'uid de l'utilisateur grafana dans l'image officielle.
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: GRAFANA_ADMIN_PASSWORD
            # L'interface est servie derriere l'Ingress sur grafana.localhost.
            # Sans cette URL, les liens des notifications d'alerte pointeraient
            # vers localhost:3000, injoignable depuis un navigateur.
            - name: GF_SERVER_ROOT_URL
              value: http://grafana.localhost:8080
            # Personne n'installe de plugin depuis une machine qui n'a pas
            # besoin de sortir sur Internet.
            - name: GF_INSTALL_PLUGINS
              value: ""
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            # Grafana applique tout son provisioning au demarrage : plus lent
            # qu'une API Node, d'ou les 12 tentatives avant de renoncer.
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: alerting
          configMap:
            name: grafana-alerting
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: todo
spec:
  selector:
    app: grafana
  ports:
    - port: 80
      targetPort: 3000
---
# Le second Ingress. Meme controleur Traefik, meme port 8080 de la machine,
# mais un hote different : c'est le nom de domaine qui aiguille, pas le port.
#
# C'est aussi la reponse a l'ambiguite notee en phase 4 : deux Ingress qui
# declarent le MEME hote avec des chemins qui se recouvrent laissent Traefik
# choisir en silence. Un hote distinct par service supprime la question.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: todo
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
