# Source de donnees declaree en fichier, pas cliquee dans l'interface.
#
# Une source configuree a la souris disparait avec le volume Grafana, et
# personne ne se souvient de ce qui avait ete saisi. Declaree ici, elle est
# recreee a l'identique a chaque demarrage, et elle se relit dans le depot.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # uid fige : le JSON du tableau de bord y fait reference. Sans uid
    # explicite, Grafana en genere un au hasard au premier demarrage, et les
    # panneaux du fichier pointeraient vers une source introuvable.
    uid: prometheus
    access: proxy

    # L'ERREUR QUI FAIT PERDRE UN QUART D'HEURE A TOUT LE MONDE : ecrire
    # localhost:9090 ici. Depuis le pod Grafana, "localhost" ne designe pas
    # Prometheus, il designe Grafana lui-meme. C'est le nom du SERVICE qu'il
    # faut, resolu par le DNS interne du cluster — exactement comme todo-db
    # pour la base.
    url: http://prometheus:9090

    isDefault: true
    editable: false

    jsonData:
      # Aligne sur le scrape_interval de prometheus.yml. Grafana s'en sert pour
      # choisir le pas de ses requetes : trop fin, il demande des points qui
      # n'existent pas et les graphiques deviennent troues.
      timeInterval: 5s
