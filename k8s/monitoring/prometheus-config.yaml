# La configuration de Prometheus, version cluster.
#
# Le fichier du jour 3 tient toujours dans deploy/prometheus.yml : il nommait
# sa cible en dur, `targets: ['todo-api:3000']`, ce qui suffisait quand il n'y
# avait qu'un conteneur. Avec trois copies qui changent de nom et d'IP a chaque
# rollout, une liste ecrite a la main serait fausse en permanence.
#
# Celui-ci ne connait aucune adresse : il demande a l'api-server quels pods
# existent, et ne garde que ceux qui se declarent scrutables par une annotation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: todo
data:
  prometheus.yml: |
    global:
      # 5 secondes, comme hier, et pour la meme raison : on veut voir les effets
      # pendant l'exercice. En production reelle, 15 ou 30 s. Chaque scrape
      # coute une requete HTTP a chacun des trois pods.
      scrape_interval: 5s
      scrape_timeout: 3s

    # Aucun rule_files ici, volontairement : les alertes restent la ou elles
    # etaient hier, dans Grafana, provisionnees en fichier. Deux systemes
    # d'alerte cote a cote, c'est deux endroits ou chercher a 3 h du matin.

    scrape_configs:
      # ---------------------------------------------------------------------
      # Les pods qui se declarent scrutables.
      # ---------------------------------------------------------------------
      - job_name: todo-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [todo]

        relabel_configs:
          # 1. On ne garde que les pods portant prometheus.io/scrape: "true".
          #    Sans ce filtre, Prometheus tenterait de scruter PostgreSQL, qui
          #    n'expose aucun /metrics, et chaque cible resterait DOWN pour
          #    rien — du bruit qui masque les vraies pannes.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

          # 2. Le port et le chemin viennent des annotations du pod, pas d'ici.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2

          # 3. Le nom du pod devient une etiquette lisible. Sans elle, les
          #    series s'appellent 10.42.0.31:3000 — impossible de savoir quelle
          #    copie parle, et donc de reconnaitre celle qui ne va pas.
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      # ---------------------------------------------------------------------
      # Prometheus se surveille lui-meme, comme hier. Ca ne coute rien, et le
      # jour ou les panneaux sont vides, la premiere question est "est-ce
      # l'application qui ne repond plus, ou Prometheus qui ne collecte plus ?".
      # ---------------------------------------------------------------------
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
