apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: todo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 2Gi pour 24 h de retention a 5 s de pas sur quatre cibles : large. La
      # surveillance qui perd son historique a chaque redemarrage ne sert a
      # rien — c'est justement la comparaison avec l'etat normal qui a revele
      # la panne 6.5 du jour 3, celle qui n'allume aucun voyant.
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: todo
spec:
  replicas: 1 # une base de series temporelles ne se duplique pas comme un service sans etat
  selector:
    matchLabels:
      app: prometheus
  strategy:
    # Recreate et pas RollingUpdate : la PVC est ReadWriteOnce, deux pods ne
    # peuvent pas la monter en meme temps. Un rolling update resterait bloque
    # indefiniment, le nouveau pod attendant un volume que l'ancien tient.
    type: Recreate
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        # L'image tourne en nobody (65534). Sans ce fsGroup, le volume
        # appartient a root et Prometheus echoue au demarrage sur un
        # "permission denied" en ouvrant son repertoire de donnees.
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # 24 h suffisent pour ce TP et bornent l'espace disque. Au-dela, on
            # ne compare plus a "hier", on compare a "la semaine derniere", et
            # ce n'est pas la question qu'on se pose pendant une astreinte.
            - --storage.tsdb.retention.time=24h
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 192Mi
              cpu: 50m
            limits:
              # Mesure faite le 6 aout 2026 : 120 a 150 Mi avec quatre cibles a
              # 5 s de pas. 384Mi laisse le double, parce qu'un Prometheus
              # OOMKille perd sa surveillance au moment ou elle sert.
              memory: 384Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: todo
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
