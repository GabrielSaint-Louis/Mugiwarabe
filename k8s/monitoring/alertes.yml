# Alertes Grafana, provisionnées comme le reste : dans le dépôt, relisibles en
# pull request, recréées à l'identique à chaque démarrage.
#
# Version cluster. Deux changements par rapport au fichier du jour 3, qui reste
# dans deploy/grafana/ pour la stack `vm-prod` :
#
#   - l'alerte 1 vise `sum(up{...})` et non `up{...}`. Avec trois copies, la
#     seconde forme rend trois séries et se déclencherait dès qu'UNE tombe —
#     c'est-à-dire à chaque rolling update. Elle ne dit plus « l'API est
#     morte » mais « plus aucune copie ne répond », ce qui est la vraie panne.
#   - une troisième alerte apparaît, et c'est celle qui manquait vraiment.
#
# Trois alertes, pas dix. Une alerte qui se déclenche souvent et qu'on ignore est
# pire que pas d'alerte du tout : elle apprend à l'équipe à ne plus regarder.
# Chaque seuil ci-dessous est justifié par une mesure prise le 5 août 2026, pas
# par une intuition.
apiVersion: 1

groups:
  - orgId: 1
    name: todo-api
    folder: Alertes
    # L'évaluation tourne toutes les 30 s. Inutile de descendre plus bas :
    # Prometheus lui-même ne scrape que toutes les 5 s, et aucune des deux
    # alertes ne se déclenche avant une minute.
    interval: 30s

    rules:
      # -----------------------------------------------------------------------
      #  1. L'API ne répond plus
      # -----------------------------------------------------------------------
      - uid: todo-api-indisponible
        title: Todo API injoignable — plus aucune copie
        condition: SEUIL
        for: 1m
        # POURQUOI 1 MINUTE, ET PAS MOINS.
        #
        # `up` bascule à 0 en 4 secondes (mesuré). On pourrait donc alerter en
        # 10 secondes. Mais un déploiement normal coupe le service 2 à 10
        # secondes (mesuré sur 4 exécutions) : une alerte à 10 s se
        # déclencherait à CHAQUE mise en production. Au bout de trois jours,
        # plus personne ne la lit.
        #
        # 1 minute = 12 scrapes consécutifs manqués, six fois la durée de la
        # plus longue coupure de déploiement observée. Si l'API est absente
        # depuis une minute, ce n'est pas un déploiement.
        annotations:
          summary: "L'API ne répond plus depuis 1 minute"
          description: >-
            up = 0 sur la cible todo-api. Ce n'est pas un déploiement : ceux-ci
            coupent 2 à 10 s. Trois causes possibles, voir le § 6 de
            docs/PROCEDURE_DEPLOIEMENT.md — c'est `docker ps -a` qui les sépare,
            et il faut lire le code de sortie.
          runbook_url: https://github.com/GabrielSaint-Louis/tp-devops-todo-api/blob/main/docs/PROCEDURE_DEPLOIEMENT.md
        labels:
          severite: critique
        noDataState: Alerting
        # NoData vaut Alerting et pas OK : si Prometheus ne renvoie plus rien du
        # tout pour cette cible, c'est une raison de s'inquiéter, pas de se
        # taire. Une alerte qui se désarme quand la surveillance tombe ne sert
        # à rien.
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(up{job="todo-api"})
              instant: true
          - refId: SEUIL
            datasourceUid: __expr__
            model:
              refId: SEUIL
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # -----------------------------------------------------------------------
      #  2. Trop d'erreurs serveur
      # -----------------------------------------------------------------------
      - uid: todo-api-taux-erreur
        title: Todo API — plus de 5 % d'erreurs serveur
        condition: SEUIL
        for: 5m
        # POURQUOI 5 % PENDANT 5 MINUTES.
        #
        # Ce n'est pas un chiffre choisi ici : c'est EXACTEMENT le critère de
        # déclenchement du retour arrière écrit au § 4 de la procédure. L'alerte
        # et la décision humaine partagent le même seuil, sinon l'une prévient
        # pour des situations où l'autre ne fait rien, et la confiance s'érode.
        #
        # Les repères mesurés le 5 août 2026 :
        #   - fonctionnement normal, même sous 12 req/s : 0,000 %
        #   - base coupée : 65 %
        # Il n'y a rien entre les deux. 5 % est donc largement au-dessus du
        # bruit (inexistant) et largement en dessous d'une vraie panne.
        #
        # 5 minutes parce que la requête calcule un taux sur une fenêtre d'une
        # minute : elle a besoin de temps pour être significative, et un pic de
        # trois requêtes ratées à 4 h du matin ne doit réveiller personne.
        annotations:
          summary: "Plus de 5 % des réponses sont des erreurs serveur"
          description: >-
            Regarder le panneau 6 du tableau de bord pour savoir de quoi il
            s'agit : des 503 signifient que la base est injoignable et que l'API
            va bien (§ 6.2 de la procédure) ; des 500 signifient que c'est le
            code, et le retour arrière s'impose (§ 4).
          runbook_url: https://github.com/GabrielSaint-Louis/tp-devops-todo-api/blob/main/docs/PROCEDURE_DEPLOIEMENT.md
        labels:
          severite: critique
        # OK et pas Alerting : sans aucun trafic, cette requête ne renvoie rien,
        # et « personne n'appelle » n'est pas « tout casse ». C'est l'alerte
        # ci-dessus qui couvre le cas où plus rien ne répond.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                100 * (sum(rate(http_requests_total{status=~"5.."}[1m])) or vector(0))
                / sum(rate(http_requests_total[1m]))
              instant: true
          - refId: SEUIL
            datasourceUid: __expr__
            model:
              refId: SEUIL
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      # -----------------------------------------------------------------------
      #  3. Une copie ne répond pas — l'alerte que le jour 4 a rendue nécessaire
      # -----------------------------------------------------------------------
      - uid: todo-api-copie-absente
        title: Todo API — une copie déclarée ne répond pas
        condition: SEUIL
        for: 5m
        # POURQUOI CETTE ALERTE N'EXISTAIT PAS HIER, ET POURQUOI ELLE EST
        # INDISPENSABLE AUJOURD'HUI.
        #
        # Mesuré le 6 août 2026, sur les cinq pannes de k8s/chaos.sh : AUCUNE
        # n'a coupé le service. Un tag d'image inexistant, une clé de Secret
        # supprimée, une limite mémoire trop basse laissent trois pods sains
        # qui continuent de répondre 200, pendant qu'un quatrième échoue en
        # boucle. Les deux alertes ci-dessus restent muettes, à juste titre :
        # de leur point de vue, tout va bien.
        #
        # C'est précisément ce qui rend ces pannes dangereuses. Personne ne se
        # plaint, donc personne ne regarde, et le pod bloqué peut rester là des
        # jours. Cette alerte est la seule chose qui les découvre.
        #
        # La requête compte les cibles à `up = 0`. Un pod en ImagePullBackOff ou
        # en CrashLoopBackOff a bien une IP, donc il est découvert et scruté, et
        # il répond `up = 0` — c'est exactement ce qu'on veut voir.
        #
        # POURQUOI 5 MINUTES. Un rolling update fait passer un pod par `up = 0`
        # pendant qu'il démarre : mesuré, 22 secondes de convergence totale.
        # 5 minutes, soit treize fois cette durée, garantit qu'un déploiement
        # normal ne déclenche jamais rien. Au-delà, ce n'est plus un
        # déploiement, c'est un pod qui ne démarrera pas.
        annotations:
          summary: "Une copie de l'API est déclarée mais ne répond pas depuis 5 minutes"
          description: >-
            Le service n'est PAS coupé : les autres copies répondent. C'est une
            panne invisible pour l'utilisateur et bien réelle pour la marge de
            sécurité. Le panneau 7 du tableau de bord nomme le pod concerné.
            Ensuite : `kubectl -n todo describe pod <pod> | grep -A3 "Last
            State"` — le code de sortie sépare les trois causes (§ 6 de la
            procédure), 1 = configuration manquante, 137 = OOMKilled, et
            ImagePullBackOff se lit directement dans `get pods`.
          runbook_url: https://github.com/GabrielSaint-Louis/tp-devops-todo-api/blob/main/docs/PROCEDURE_DEPLOIEMENT.md
        labels:
          severite: avertissement
        # OK et pas Alerting : si Prometheus ne découvre aucune cible, c'est
        # l'alerte 1 qui parle. Celle-ci ne doit pas doubler le bruit.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: count(up{job="todo-api"} == 0) or vector(0)
              instant: true
          - refId: SEUIL
            datasourceUid: __expr__
            model:
              refId: SEUIL
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # -----------------------------------------------------------------------
      #  4. La base ne répond plus — l'alerte qui remplace le mensonge de /health
      # -----------------------------------------------------------------------
      - uid: todo-db-injoignable
        title: Todo API — la base ne répond plus
        condition: SEUIL
        for: 2m
        # CE QUE CETTE ALERTE REMPLACE.
        #
        # Mesuré en phase 7 : base coupée, les trois pods restent `READY 1/1`,
        # aucun événement `Unhealthy`, et pourtant `/api/tasks` renvoie 503. Les
        # deux sondes du pod interrogent `/health`, qui répond `ok` sans jamais
        # toucher la base. Elles ne mentent pas, elles répondent à une autre
        # question — « le serveur écoute » et non « le service est rendu ».
        #
        # La correction naïve, brancher la readinessProbe sur un `/health` qui
        # interroge Postgres, serait pire que le mal : avec trois copies sondées
        # toutes les 5 s, une base qui ralentit un peu ferait échouer les trois
        # sondes en même temps, le Service perdrait tous ses endpoints, et une
        # base LENTE deviendrait une application TOTALEMENT indisponible.
        #
        # D'où ce partage : les sondes gardent `/health` et ne tuent rien ; la
        # métrique `todo_db_up` dit la vérité et c'est une ALERTE qui réveille
        # un humain. Personne ne coupe le service à la place de l'humain.
        #
        # POURQUOI 2 MINUTES. `todo_db_up` est rafraîchi toutes les 10 s par pod
        # (src/db.js). Un redémarrage de la base dure une vingtaine de secondes,
        # pendant lesquelles la métrique tombe légitimement à 0. Deux minutes,
        # six fois cette durée, laisse passer un redémarrage normal.
        annotations:
          summary: "La base est injoignable depuis au moins une copie de l'API"
          description: >-
            L'API répond toujours et ses pods restent READY 1/1 : c'est voulu,
            /health ne regarde pas la base. Vérifier de quel côté est le
            problème avec `curl -H "Host: todo.localhost"
            http://127.0.0.1:8080/ready`, dont le champ `detail` porte le
            message brut de pg. Puis § 6.2 de la procédure.
          runbook_url: https://github.com/GabrielSaint-Louis/tp-devops-todo-api/blob/main/docs/PROCEDURE_DEPLOIEMENT.md
        labels:
          severite: critique
        # OK : sans aucune copie vivante, il n'y a plus personne pour rapporter
        # cette métrique. C'est l'alerte 1 qui parle alors, pas celle-ci.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: min(todo_db_up)
              instant: true
          - refId: SEUIL
            datasourceUid: __expr__
            model:
              refId: SEUIL
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
