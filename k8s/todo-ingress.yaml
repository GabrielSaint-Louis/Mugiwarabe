# La porte d'entree. Sans elle, seul un kubectl port-forward retape a chaque
# fois atteignait l'API — jamais ce qu'un vrai utilisateur ferait.
#
# Le chemin complet, de bout en bout :
#   navigateur -> localhost:8080 (le -p "8080:80@loadbalancer" du k3d create)
#             -> port 80 du cluster, ou Traefik ecoute
#             -> cette regle, qui lit l'en-tete Host
#             -> Service todo-api:80 -> pods todo-api:3000
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-ingress
  namespace: todo
spec:
  # Traefik est le controleur d'entree que K3s embarque par defaut : rien a
  # installer, il ecoute deja.
  ingressClassName: traefik
  rules:
    - host: todo.localhost
      http:
        paths:
          - path: /
            # Prefix et pas Exact : sinon seule la racine repondrait, et
            # /health comme /api/tasks tomberaient en 404 de routage.
            pathType: Prefix
            backend:
              service:
                name: todo-api
                # 80, le port du SERVICE, pas 3000 le port du conteneur : viser
                # 3000 ici donne une erreur de passerelle, jamais une reponse.
                port:
                  number: 80
