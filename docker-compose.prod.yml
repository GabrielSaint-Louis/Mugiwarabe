# Stack de production : aucun `build:`, uniquement des images deja publiees.
#
# C'est la separation build / run. Le code source n'est plus necessaire pour
# deployer : ce fichier et un .env suffisent. Verifiable litteralement, dans un
# dossier vide qui ne contient que ces deux fichiers :
#
#   docker compose -f docker-compose.prod.yml up -d
#
# IMAGE_PREFIX permet de basculer de registry sans toucher a ce fichier :
#   localhost:5000/gabrielsaint-louis   registry prive local
#   gabrielsaint-louis                  Docker Hub
#   ghcr.io/gabrielsaint-louis          GitHub Container Registry
name: todo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - todo-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  todo-api:
    # `build: .` du fichier de dev devient un `image:` versionne. Un tag de
    # version explicite, jamais `latest` : sur un registry partage, `latest`
    # change de contenu a chaque push sans que rien ne le distingue.
    image: ${IMAGE_PREFIX:-localhost:5000/gabrielsaint-louis}/todo-api:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  stats-api:
    image: ${IMAGE_PREFIX:-localhost:5000/gabrielsaint-louis}/stats-api:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${STATS_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  # Adminer est conserve ici parce que le chapitre 9 demande de garder le reste
  # de la configuration a l'identique. En production reelle, il partirait dans
  # un profile (`profiles: ["dev"]`) : personne ne veut exposer une interface
  # d'administration de base de donnees en prod.
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: ${DB_HOST}
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

networks:
  todo-network:
    name: todo-network

volumes:
  pgdata:
