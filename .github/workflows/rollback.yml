name: Retour arriere

# Le retour arriere depuis la pipeline plutot qu'a la main.
#
# Pourquoi c'est mieux qu'un kubectl tape dans un terminal : la personne
# d'astreinte n'a pas besoin d'un kubeconfig sur sa machine, ni de savoir quel
# contexte ni quel namespace viser. Un navigateur suffit. Et le geste laisse une
# trace horodatee dans l'onglet Actions, avec le nom de qui l'a declenche — ce
# qu'un `kubectl` dans un terminal ne laisse nulle part.
#
# Ce que ce workflow NE fait PAS, volontairement : choisir la version a sa
# place. Le sha se saisit a la main. Un retour arriere automatique vers "la
# version d'avant" se trompe des que deux deploiements se sont enchaines, et
# personne ne veut decouvrir ca pendant une panne. C'est aussi ce qui le
# distingue d'un `kubectl rollout undo` nu, qui vise toujours la revision
# precedente sans dire laquelle.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Le sha complet (40 caracteres) de la version a remettre en place"
        required: true
        type: string
      raison:
        description: "Pourquoi (apparait dans le journal du run)"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gabrielsaint-louis/todo-api

jobs:
  rollback:
    name: Remettre en place une version anterieure
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      NS: todo
      CTX: k3d-todo-cluster
    steps:
      - name: Ce qu'on s'apprete a faire
        run: |
          echo "Version demandee : ${{ inputs.sha }}"
          echo "Raison           : ${{ inputs.raison }}"
          echo "Declenche par    : ${{ github.actor }}"

          # Un sha court passerait la saisie et echouerait plus loin sur un
          # ImagePullBackOff moins clair : les images sont taguees avec le sha
          # complet. On refuse tout de suite, avec la raison.
          if ! echo "${{ inputs.sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::'${{ inputs.sha }}' n'est pas un sha complet de 40 caracteres hexadecimaux."
            exit 1
          fi

      - name: Version en place avant l'operation
        run: |
          # Note pour le debriefing : d'ou on partait. Sans cette ligne, on ne
          # sait plus quelle version etait fautive une fois le calme revenu.
          kubectl --context "$CTX" -n "$NS" get deployment todo-api \
            -o jsonpath='avant le retour arriere -> {.spec.template.spec.containers[0].image}{"\n"}'
          echo "--- revisions connues du cluster ---"
          kubectl --context "$CTX" -n "$NS" rollout history deployment/todo-api

      - name: Appliquer
        run: |
          # Exactement la commande du deploiement normal, au sha pres, et
          # exactement celle que la procedure fait taper a un humain. Trois
          # chemins, un seul geste : c'est ce qui garantit que celui d'astreinte
          # a deja ete teste des dizaines de fois.
          kubectl --context "$CTX" -n "$NS" set image \
            deployment/todo-api todo-api="$IMAGE:${{ inputs.sha }}"

      - name: Verifier que le service est revenu
        run: |
          if ! kubectl --context "$CTX" -n "$NS" rollout status deployment/todo-api --timeout=120s; then
            echo "::error::Le retour arriere n'a pas converge. Passer en manuel, section 5 de docs/PROCEDURE_DEPLOIEMENT.md"
            kubectl --context "$CTX" -n "$NS" get pods -l app=todo-api
            kubectl --context "$CTX" -n "$NS" get events --sort-by=.lastTimestamp | tail -15
            exit 1
          fi

          for i in $(seq 1 15); do
            if curl -sf -H "Host: todo.localhost" http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "Service retabli sur ${{ inputs.sha }} apres $i tentative(s)."
              exit 0
            fi
            sleep 2
          done

          # Un retour arriere qui echoue est la pire situation de la journee :
          # on affiche tout ce qu'il faut pour enchainer sans se reconnecter.
          echo "::error::Les pods sont prets mais l'API ne repond pas par l'Ingress."
          kubectl --context "$CTX" -n "$NS" get ingress,svc,endpoints
          exit 1

      - name: Rappel de ce qu'il reste a faire
        if: success()
        run: |
          echo "::warning::Le service est revenu, mais le commit fautif est TOUJOURS sur main."
          echo "Il sera redeploye au prochain push. Le corriger ou le reverter maintenant :"
          echo "    git revert <sha-fautif> && git push"
