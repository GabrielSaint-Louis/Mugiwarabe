name: Retour arriere

# Le retour arriere depuis la pipeline plutot qu'a la main.
#
# Pourquoi c'est mieux qu'un SSH : la personne d'astreinte n'a pas besoin de la
# cle privee, ni de savoir ou vit /srv/todo, ni meme d'avoir le depot sur sa
# machine. Un navigateur suffit. Et le geste laisse une trace horodatee dans
# l'onglet Actions, avec le nom de qui l'a declenche — ce qu'un `ssh` dans un
# terminal ne laisse nulle part.
#
# Ce que ce workflow NE fait PAS, volontairement : choisir la version a sa
# place. Le sha se saisit a la main. Un retour arriere automatique vers "la
# version d'avant" se trompe des que deux deploiements se sont enchaines, et
# personne ne veut decouvrir ca pendant une panne.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Le sha complet (40 caracteres) de la version a remettre en place"
        required: true
        type: string
      raison:
        description: "Pourquoi (apparait dans le journal du run)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Remettre en place une version anterieure
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Ce qu'on s'apprete a faire
        run: |
          echo "Version demandee : ${{ inputs.sha }}"
          echo "Raison           : ${{ inputs.raison }}"
          echo "Declenche par    : ${{ github.actor }}"

          # Un sha court passerait la saisie et echouerait plus loin sur un
          # "manifest unknown" moins clair : les images sont taguees avec le sha
          # complet. On refuse tout de suite, avec la raison.
          if ! echo "${{ inputs.sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::'${{ inputs.sha }}' n'est pas un sha complet de 40 caracteres hexadecimaux."
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Faire connaissance avec la machine cible
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -R "[${{ secrets.DEPLOY_HOST }}]:${{ secrets.DEPLOY_PORT }}" >/dev/null 2>&1 || true
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Version en place avant l'operation
        run: |
          # Note pour le debriefing : d'ou on partait. Sans cette ligne, on ne
          # sait plus quelle version etait fautive une fois le calme revenu.
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'grep ^TAG= /srv/todo/.env'

      - name: Appliquer
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "docker login ghcr.io -u ${{ github.actor }} --password-stdin" <<< "${{ secrets.GITHUB_TOKEN }}"

          # Exactement la commande du deploiement normal et exactement celle de
          # la procedure ecrite. Trois chemins, un seul geste.
          ssh -p ${{ secrets.DEPLOY_PORT }} \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "/srv/todo/apply.sh ${{ inputs.sha }}"

      - name: Verifier que le service est revenu
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:13000/health | grep -q '"status":"ok"'; then
              echo "Service retabli sur ${{ inputs.sha }} apres $i tentative(s)."
              exit 0
            fi
            sleep 2
          done

          # Un retour arriere qui echoue est la pire situation de la journee :
          # on affiche tout ce qu'il faut pour enchainer sans se reconnecter.
          echo "::error::Le retour arriere n'a pas retabli le service. Passer en manuel, § 4 de docs/PROCEDURE_DEPLOIEMENT.md"
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd /srv/todo && docker compose ps && docker logs --tail 20 todo-api 2>&1'
          exit 1

      - name: Rappel de ce qu'il reste a faire
        if: success()
        run: |
          echo "::warning::Le service est revenu, mais le commit fautif est TOUJOURS sur main."
          echo "Il sera redeploye au prochain push. Le corriger ou le reverter maintenant :"
          echo "    git revert <sha-fautif> && git push"
