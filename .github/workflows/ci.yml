name: CI

# Le decalage que corrige cette phase : la pipeline du jour 2 vivait sur
# ClickFast, le projet d'echauffement. La Todo API, elle, avait bien une image
# publiee, mais poussee a la main un soir. Plus maintenant.
#
# Une pull request VERIFIE (lint, tests, l'image se construit). Un push sur
# main verifie ET PUBLIE. C'est la meme pipeline : seule la derniere etape est
# conditionnee a la branche.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push qui arrive pendant qu'une execution tourne annule la precedente :
# inutile de construire une image pour un etat du code qui n'existe deja plus.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GHCR exige un nom d'image entierement en minuscules, la ou le proprietaire
  # GitHub s'ecrit GabrielSaint-Louis. On fige donc la valeur ici plutot que de
  # la deriver de ${{ github.repository }}, qui casserait au premier push avec
  # un "invalid reference format" incomprehensible.
  IMAGE: ghcr.io/gabrielsaint-louis/todo-api

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1a et 1b - les deux jobs les moins chers, en parallele. Aucun `needs:`
  # entre eux : attendre les tests pour apprendre qu'il manque un point-virgule
  # est du temps perdu. C'est `build` qui attend les deux.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # `npm run lint` porte deja --max-warnings=0 : la commande locale et celle
      # de la CI sont la meme, un warning tolere en local rougit ici aussi.
      - run: npm run lint

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      # Le runner est une machine neuve : sans checkout, il n'a meme pas le code.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Sans ce cache, npm ci retelecharge tout a chaque execution.
          cache: 'npm'

      # `npm ci` et pas `npm install` : installation stricte depuis le lock file.
      - run: npm ci

      # Suite unitaire seulement : aucune base n'est joignable depuis ce job,
      # et c'est exactement la limite que la phase 6 viendra combler.
      - run: npm test

  # ---------------------------------------------------------------------------
  # Stage 1c - les tests qui touchent vraiment la base.
  #
  # Le deploiement est automatique depuis la phase 4 : plus rien ne s'interpose
  # entre un commit et la production. Il devient donc urgent que la pipeline
  # sache dire non, et un test unitaire ne le sait pas — la regression de la
  # phase 5 est passee devant 22 d'entre eux sans en reveiller un seul.
  #
  # Ce job reste sur ubuntu-latest : il n'a besoin de rien de local, juste
  # d'une base jetable a cote de lui.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Tests d'integration
    runs-on: ubuntu-latest

    # GitHub demarre ce conteneur a cote du job, pour toute sa duree, puis le
    # detruit. Meme principe que le docker-compose du jour 1, sauf que GitHub
    # s'en charge. La base est jetable, jamais la vraie : chaque execution
    # repart d'un etat identique, connu, vide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Lues par l'image postgres elle-meme, au tout premier demarrage :
          # c'est elle qui cree l'utilisateur et la base, pas notre code.
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_pass
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        # Sans ce garde-fou, les tests demarrent parfois pendant que Postgres
        # finit son initdb, et echouent une fois sur trois sans qu'on
        # comprenne pourquoi.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Un `services:` place le conteneur sur le meme reseau que le job : on le
      # joint par localhost, pas par son nom de service comme dans un compose.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: todo_test
      DB_USER: todo_user
      DB_PASSWORD: todo_pass

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Le schema doit exister avant que le premier test ne tourne, sinon tous
      # echouent sur un "relation tasks does not exist" et on cherche le bug au
      # mauvais endroit.
      - run: npm run migrate

      - run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Stage 2 - on ne construit une image que si le lint ET les tests sont verts.
  # ---------------------------------------------------------------------------
  build:
    name: Image Docker
    needs: [lint, test, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Le GITHUB_TOKEN du run suffit a pousser sur GHCR : aucun mot de passe
      # de registry a stocker en secret, et le jeton meurt avec le job.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Tag par sha de commit, jamais `latest` : on saura toujours quel code a
      # produit quelle image, on pourra remonter du conteneur au commit exact,
      # et surtout le retour arriere de la phase 5 devient une simple question
      # de nom.
      - name: Build de l'image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # Un build qui passe ne prouve pas que l'image sert a quelque chose. On la
      # demarre vraiment et on lui parle avant de la declarer bonne. /health
      # repond sans base : c'est voulu depuis le jour 1, l'API doit pouvoir dire
      # "je suis la" meme quand Postgres demarre encore.
      - name: Smoke test de l'image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e DB_HOST=inexistant -e DB_NAME=todo -e DB_USER=todo -e DB_PASSWORD=todo \
            "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3000/health | grep -q '"status":"ok"'
          # Une route inconnue doit repondre du JSON, pas la page d'erreur HTML
          # d'Express : c'est la garantie donnee aux clients de cette API.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/pas-une-route)" = "404"
          docker rm -f smoke

      - name: Taille de l'image
        # Bloc `|` et non scalaire simple : le `: ` du format ferait lire une cle
        # a YAML, et le workflow entier serait refuse avant de demarrer.
        run: |
          docker images "$IMAGE:${{ github.sha }}" --format 'Taille de l image -> {{.Size}}'

      # --- A partir d'ici, uniquement sur main -------------------------------
      # Une branche de travail s'arrete au build : elle prouve que l'image se
      # construit et tourne, sans rien publier. Le registry ne recoit que du
      # code deja fusionne.
      - name: Connexion au registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}"


  # ---------------------------------------------------------------------------
  # Stage 3 - le deploiement. La cible a change de nature entre hier et
  # aujourd'hui : ce n'est plus une machine qu'on joint en SSH pour y jouer
  # trois commandes, c'est un cluster a qui on annonce un nouvel etat voulu.
  #
  # Ce job reste self-hosted, mais plus du tout pour la meme raison qu'hier.
  # Hier, le runner etait le seul a pouvoir joindre vm-prod, qui n'a pas
  # d'adresse publique. Aujourd'hui, le runner et todo-cluster tournent sur la
  # MEME machine : le runner lit deja ~/.kube/config, que k3d a rempli a la
  # creation du cluster. Aucune cle, aucun secret GitHub supplementaire, aucune
  # empreinte d'hote a accepter. Le deploiement est devenu plus simple qu'hier,
  # pas plus complique.
  #
  # Et surtout, ce que ces quatre secrets DEPLOY_* garantissaient a grand-peine
  # — que la cle privee ne touche jamais le disque du runner — n'a plus lieu
  # d'etre : il n'y a plus de cle privee dans ce workflow.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploiement sur le cluster
    # Rien ne se deploie avant que l'image existe sur le registry : un
    # `kubectl set image` vers un tag absent laisse le rollout bloque, et le
    # job passe alors dix minutes a echouer pour une raison evitable.
    needs: [build]
    runs-on: self-hosted
    # Le garde-fou, inchange depuis hier. Ce depot est public, et un runner
    # self-hosted execute sur une vraie machine ce que la pipeline lui dit
    # d'executer. Cette ligne separe "ma machine execute ce que j'ai fusionne
    # moi-meme" de "ma machine execute ce que n'importe qui a propose".
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    env:
      NS: todo
      # Le contexte est nomme explicitement a chaque commande. Sans lui, un
      # kubectl qui pointe ailleurs (un second cluster cree entre-temps,
      # un `use-context` oublie la veille) deploierait sans broncher sur la
      # mauvaise cible, et le job serait vert.
      CTX: k3d-todo-cluster
    steps:
      - uses: actions/checkout@v4

      # L'equivalent 2026 du "les secrets sont-ils tous la" d'hier : on verifie
      # ce dont depend la suite AVANT de commencer, pour que l'echec nomme sa
      # cause. Un kubectl absent du PATH du runner echouerait sinon sur un
      # "command not found" au milieu d'un rollout a moitie lance.
      - name: Le cluster est-il joignable
        run: |
          if ! command -v kubectl >/dev/null; then
            echo "::error::kubectl est absent du PATH du runner self-hosted. L'installer sur la machine, il n'est pas fourni par le workflow."
            exit 1
          fi
          if ! kubectl --context "$CTX" get ns "$NS" >/dev/null 2>&1; then
            echo "::error::Le contexte $CTX ou le namespace $NS est injoignable. Le cluster todo-cluster tourne-t-il encore ? (k3d cluster list)"
            exit 1
          fi
          echo "Contexte $CTX joignable, namespace $NS present."
          kubectl --context "$CTX" get nodes

      # Les manifestes sont du code : ils partent d'ici a chaque deploiement,
      # exactement comme le compose.yml partait en scp hier. C'est ce qui evite
      # le drift — l'ecart entre ce que dit le fichier versionne et ce que le
      # cluster fait vraiment.
      #
      # Le Secret n'est pas dans la liste, et c'est volontaire : il n'existe pas
      # dans le depot. Il a ete pose une fois a la main sur le cluster, comme le
      # .env l'etait sur vm-prod.
      - name: Envoyer l'etat voulu
        run: |
          kubectl --context "$CTX" apply \
            -f k8s/todo-config.yaml \
            -f k8s/todo-db.yaml \
            -f k8s/todo-api-deployment.yaml \
            -f k8s/todo-api-service.yaml \
            -f k8s/todo-ingress.yaml

      # La surveillance est du code au meme titre que le reste : le tableau de
      # bord et les alertes partent d'ici a chaque deploiement, exactement comme
      # le dossier grafana/ partait en scp hier. Un panneau bricole a la souris
      # pendant une astreinte est ecrase au deploiement suivant — c'est le
      # comportement voulu.
      - name: Envoyer la surveillance
        env:
          KCTX: ${{ env.CTX }}
        run: ./k8s/monitoring/appliquer.sh

      # LA commande de deploiement. Elle vient APRES l'apply, jamais avant :
      # l'apply remet le tag ecrit dans le fichier, cette ligne pose celui du
      # commit qui vient d'etre pousse.
      - name: Poser la nouvelle image
        run: |
          kubectl --context "$CTX" -n "$NS" set image \
            deployment/todo-api todo-api="$IMAGE:${{ github.sha }}"

      # Le gate. Sans lui, le job serait vert des que l'ordre est accepte, ce
      # qui ne dit rien de ce qui tourne : `set image` reussit meme quand
      # l'image n'existe pas. Avec lui, le job attend que les pods soient
      # vraiment prets, et rougit sinon.
      #
      # 180s : large devant les ~20s d'un rolling update sain, assez court pour
      # qu'un tag inexistant ne bloque pas la file d'attente du runner.
      - name: Attendre que le rollout converge
        run: |
          if ! kubectl --context "$CTX" -n "$NS" rollout status deployment/todo-api --timeout=180s; then
            echo "::error::Le rollout n'a pas converge en 180s. Le deploiement est en echec, l'ancienne version tourne toujours."
            kubectl --context "$CTX" -n "$NS" get pods -l app=todo-api
            kubectl --context "$CTX" -n "$NS" describe deployment todo-api | tail -30
            echo "--- evenements recents ---"
            kubectl --context "$CTX" -n "$NS" get events --sort-by=.lastTimestamp | tail -15
            exit 1
          fi

      # Un rollout converge prouve que les pods sont prets au sens des sondes.
      # Il ne prouve pas que le chemin complet fonctionne. On interroge donc
      # l'API par l'Ingress, la ou passe un vrai utilisateur.
      - name: Verifier que l'API repond par l'Ingress
        run: |
          for i in $(seq 1 15); do
            if curl -sf -H "Host: todo.localhost" http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "L'API repond par l'Ingress apres $i tentative(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Les pods sont prets mais l'Ingress ne sert rien. Regarder l'Ingress et les endpoints du Service, pas les pods."
          kubectl --context "$CTX" -n "$NS" get ingress,svc,endpoints
          exit 1

      - name: Ce qui tourne maintenant
        run: |
          echo "Version deployee : ${{ github.sha }}"
          kubectl --context "$CTX" -n "$NS" get deployment todo-api \
            -o jsonpath='image en cours -> {.spec.template.spec.containers[0].image}{"\n"}'
          kubectl --context "$CTX" -n "$NS" get pods -l app=todo-api
