name: CI

# Le decalage que corrige cette phase : la pipeline du jour 2 vivait sur
# ClickFast, le projet d'echauffement. La Todo API, elle, avait bien une image
# publiee, mais poussee a la main un soir. Plus maintenant.
#
# Une pull request VERIFIE (lint, tests, l'image se construit). Un push sur
# main verifie ET PUBLIE. C'est la meme pipeline : seule la derniere etape est
# conditionnee a la branche.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push qui arrive pendant qu'une execution tourne annule la precedente :
# inutile de construire une image pour un etat du code qui n'existe deja plus.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GHCR exige un nom d'image entierement en minuscules, la ou le proprietaire
  # GitHub s'ecrit GabrielSaint-Louis. On fige donc la valeur ici plutot que de
  # la deriver de ${{ github.repository }}, qui casserait au premier push avec
  # un "invalid reference format" incomprehensible.
  IMAGE: ghcr.io/gabrielsaint-louis/todo-api

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1a et 1b - les deux jobs les moins chers, en parallele. Aucun `needs:`
  # entre eux : attendre les tests pour apprendre qu'il manque un point-virgule
  # est du temps perdu. C'est `build` qui attend les deux.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # `npm run lint` porte deja --max-warnings=0 : la commande locale et celle
      # de la CI sont la meme, un warning tolere en local rougit ici aussi.
      - run: npm run lint

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      # Le runner est une machine neuve : sans checkout, il n'a meme pas le code.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Sans ce cache, npm ci retelecharge tout a chaque execution.
          cache: 'npm'

      # `npm ci` et pas `npm install` : installation stricte depuis le lock file.
      - run: npm ci

      # Suite unitaire seulement : aucune base n'est joignable depuis ce job,
      # et c'est exactement la limite que la phase 6 viendra combler.
      - run: npm test

  # ---------------------------------------------------------------------------
  # Stage 1c - les tests qui touchent vraiment la base.
  #
  # Le deploiement est automatique depuis la phase 4 : plus rien ne s'interpose
  # entre un commit et la production. Il devient donc urgent que la pipeline
  # sache dire non, et un test unitaire ne le sait pas — la regression de la
  # phase 5 est passee devant 22 d'entre eux sans en reveiller un seul.
  #
  # Ce job reste sur ubuntu-latest : il n'a besoin de rien de local, juste
  # d'une base jetable a cote de lui.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Tests d'integration
    runs-on: ubuntu-latest

    # GitHub demarre ce conteneur a cote du job, pour toute sa duree, puis le
    # detruit. Meme principe que le docker-compose du jour 1, sauf que GitHub
    # s'en charge. La base est jetable, jamais la vraie : chaque execution
    # repart d'un etat identique, connu, vide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Lues par l'image postgres elle-meme, au tout premier demarrage :
          # c'est elle qui cree l'utilisateur et la base, pas notre code.
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_pass
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        # Sans ce garde-fou, les tests demarrent parfois pendant que Postgres
        # finit son initdb, et echouent une fois sur trois sans qu'on
        # comprenne pourquoi.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Un `services:` place le conteneur sur le meme reseau que le job : on le
      # joint par localhost, pas par son nom de service comme dans un compose.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: todo_test
      DB_USER: todo_user
      DB_PASSWORD: todo_pass

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Le schema doit exister avant que le premier test ne tourne, sinon tous
      # echouent sur un "relation tasks does not exist" et on cherche le bug au
      # mauvais endroit.
      - run: npm run migrate

      - run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Stage 2 - on ne construit une image que si le lint ET les tests sont verts.
  # ---------------------------------------------------------------------------
  build:
    name: Image Docker
    needs: [lint, test, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Le GITHUB_TOKEN du run suffit a pousser sur GHCR : aucun mot de passe
      # de registry a stocker en secret, et le jeton meurt avec le job.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Tag par sha de commit, jamais `latest` : on saura toujours quel code a
      # produit quelle image, on pourra remonter du conteneur au commit exact,
      # et surtout le retour arriere de la phase 5 devient une simple question
      # de nom.
      - name: Build de l'image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # Un build qui passe ne prouve pas que l'image sert a quelque chose. On la
      # demarre vraiment et on lui parle avant de la declarer bonne. /health
      # repond sans base : c'est voulu depuis le jour 1, l'API doit pouvoir dire
      # "je suis la" meme quand Postgres demarre encore.
      - name: Smoke test de l'image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e DB_HOST=inexistant -e DB_NAME=todo -e DB_USER=todo -e DB_PASSWORD=todo \
            "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3000/health | grep -q '"status":"ok"'
          # Une route inconnue doit repondre du JSON, pas la page d'erreur HTML
          # d'Express : c'est la garantie donnee aux clients de cette API.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/pas-une-route)" = "404"
          docker rm -f smoke

      - name: Taille de l'image
        # Bloc `|` et non scalaire simple : le `: ` du format ferait lire une cle
        # a YAML, et le workflow entier serait refuse avant de demarrer.
        run: |
          docker images "$IMAGE:${{ github.sha }}" --format 'Taille de l image -> {{.Size}}'

      # --- A partir d'ici, uniquement sur main -------------------------------
      # Une branche de travail s'arrete au build : elle prouve que l'image se
      # construit et tourne, sans rien publier. Le registry ne recoit que du
      # code deja fusionne.
      - name: Connexion au registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # Stage 3 - le deploiement. C'est l'etape qui manquait hier soir : une image
  # neuve dormait sur le registry pendant que le serveur continuait de faire
  # tourner, sans le savoir, la version d'il y a deux semaines.
  #
  # Ce job est le seul a tourner en self-hosted, et pour une raison precise :
  # la machine cible n'a pas d'adresse publique, aucun runner GitHub ne peut la
  # joindre. Chaque job choisit son runner, et seul celui qui doit atteindre une
  # machine privee tourne ici.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploiement
    # Rien ne se deploie avant que l'image existe sur le registry.
    needs: [build]
    runs-on: self-hosted
    # Le garde-fou. Ce depot est public, et un runner self-hosted execute sur
    # une vraie machine ce que la pipeline lui dit d'executer. Cette ligne
    # separe "ma machine execute ce que j'ai fusionne moi-meme" de "ma machine
    # execute ce que n'importe qui a propose".
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # Pour que la machine cible puisse tirer l'image depuis GHCR, on lui prete
      # le jeton du run. Il expire avec le job : aucun mot de passe de registry
      # ne reste sur la machine cible.
      packages: read
    steps:
      - uses: actions/checkout@v7

      # La cle privee arrive en memoire, pas sur le disque. C'est le piege
      # classique : une cle ecrite dans un fichier temporaire finit par trainer
      # sur le disque du runner — et ce runner-ci n'est pas jetable, il tourne
      # sur une machine qui sert a autre chose. L'agent SSH garde la cle le
      # temps de la session et la prete a ssh et scp, sans qu'elle touche le
      # systeme de fichiers.
      - name: Charger la cle dans l'agent SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Sans cette empreinte, ssh s'arreterait sur sa question interactive
      # ("Are you sure you want to continue connecting?") et le job resterait
      # bloque jusqu'au timeout, sans message clair.
      - name: Faire connaissance avec la machine cible
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # On retire l'ancienne empreinte avant d'ecrire la nouvelle. Deux
          # raisons : le fichier ne gonfle pas d'une ligne identique a chaque
          # deploiement, et surtout une machine cible reconstruite (nouvelle
          # cle d'hote) ne fait pas echouer tous les deploiements suivants sur
          # un "REMOTE HOST IDENTIFICATION HAS CHANGED".
          ssh-keygen -R "[${{ secrets.DEPLOY_HOST }}]:${{ secrets.DEPLOY_PORT }}" >/dev/null 2>&1 || true
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      # Le compose.yml est du code : il vit dans le depot, il part sur la
      # machine par la pipeline, et il ne se modifie jamais directement en
      # production. Le .env, lui, ne bouge pas : il a ete pose une fois a la
      # main et contient les mots de passe.
      - name: Envoyer la description de la stack
        run: |
          scp -P ${{ secrets.DEPLOY_PORT }} deploy/compose.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/todo/compose.yml

      - name: Demarrer la nouvelle version
        run: |
          # Le jeton passe par l'entree standard, jamais en argument : un
          # `docker login -p <jeton>` se retrouverait dans l'historique du shell
          # et dans la liste des process de la machine cible.
          ssh -p ${{ secrets.DEPLOY_PORT }} \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "docker login ghcr.io -u ${{ github.actor }} --password-stdin" <<< "${{ secrets.GITHUB_TOKEN }}"

          # LA commande de deploiement, et elle tient en une ligne. `up -d`
          # compare l'etat voulu a l'etat reel et ne touche que ce qui a change :
          # rejouee dix fois, elle laisse un seul conteneur todo-api, toujours a
          # jour, la ou une sequence naive de docker run planterait sur un nom
          # deja pris.
          ssh -p ${{ secrets.DEPLOY_PORT }} \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "cd /srv/todo && TAG=${{ github.sha }} docker compose up -d --remove-orphans"

      # Un deploiement qui ne verifie rien n'est pas un deploiement, c'est un
      # espoir. On interroge l'API DE L'EXTERIEUR de la machine cible, par le
      # port qu'elle publie : c'est le chemin qu'emprunte un vrai utilisateur.
      #
      # 13000 et pas 3000 : la machine cible publie son port 3000 sur 13000 cote
      # hote, parce que 3000 appartient deja a un autre site sur cette machine.
      # Cette valeur n'est pas un secret, elle reste donc en clair ici — a la
      # difference de l'adresse, du port SSH et de l'utilisateur.
      - name: Verifier que l'API repond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:13000/health | grep -q '"status":"ok"'; then
              echo "L'API repond apres $i tentative(s)."
              curl -s http://127.0.0.1:13000/health
              exit 0
            fi
            sleep 2
          done

          # Une minute sans reponse : le job echoue, et il laisse de quoi
          # comprendre pourquoi. Un `exit 1` nu obligerait a se connecter a la
          # machine pour apprendre ce que ces trois commandes disent deja.
          echo "::error::L'API ne repond pas apres 60 secondes. Deploiement en echec."
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd /srv/todo && docker compose ps && echo "--- logs todo-api ---" && docker compose logs --tail=40 todo-api'
          exit 1

      - name: Ce qui tourne maintenant
        run: |
          echo "Version deployee : ${{ github.sha }}"
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker inspect -f 'image en cours -> {{.Config.Image}}' todo-api"
