name: Ou tourne ce job

# Phase 3, la preuve. Deux jobs identiques, un seul mot qui change : `runs-on`.
# L'un s'execute sur la machine qui heberge la cible, l'autre dans un centre de
# donnees GitHub. Les mettre cote a cote rend visible ce que la doc explique en
# trois paragraphes.
#
# MIS A JOUR LE 2026-08-06. Les deux jobs testaient le port SSH 2222 de
# vm-prod, qui n'est plus la cible depuis le jour 4 et qui est arretee. Ce
# fichier a donc rougi pour une raison qui n'avait rien a voir avec ce qu'il
# mesure — le pire genre d'echec, celui qui apprend a ignorer un job rouge.
# La cible est desormais le cluster, et la question posee reste la meme.
#
# Declenchement MANUEL et rien d'autre. C'est le garde-fou de la phase 3 : ce
# depot est public, un runner self-hosted execute ce que la pipeline lui dit
# d'executer sur une vraie machine, et n'importe qui peut proposer une pull
# request. Sans `push:` ni `pull_request:` ici, aucun code propose de
# l'exterieur ne peut atteindre cette machine par ce fichier.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chez-moi:
    name: self-hosted
    runs-on: self-hosted
    steps:
      - name: Qui suis-je, et qui tourne a cote de moi
        run: |
          echo "hostname : $(hostname)"
          echo "--- conteneurs visibles depuis ce runner ---"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "--- ce runner tourne-t-il en service systeme ---"
          # Depuis le 2026-08-06, ce runner n'est plus un `nohup ./run.sh` : il
          # est un service systemd, actif au demarrage de la machine et relance
          # tout seul s'il meurt. Cette ligne le prouve depuis l'interieur d'un
          # job — c'est-a-dire la seule ou ca compte.
          test "$INVOCATION_ID" != "" && echo "lance par systemd (INVOCATION_ID pose)" \
            || echo "PAS un service systemd : voir le § 7 de la procedure"

          echo "--- le cluster est-il joignable d'ici ---"
          # Le runner et le cluster vivent sur le meme hote : c'est toute la
          # raison d'etre de ce runner. Un runner GitHub, lui, n'a aucun chemin
          # vers un cluster qui n'a pas d'adresse publique.
          kubectl --context k3d-todo-cluster -n todo get pods -l app=todo-api

  chez-github:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Le meme job, ailleurs
        run: |
          echo "hostname : $(hostname)"
          echo "--- conteneurs visibles depuis ce runner ---"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "--- le cluster est-il joignable d'ici ---"
          # L'echec est le resultat ATTENDU, pas un incident, d'ou le `|| echo`.
          # Un cluster qui tourne dans le Docker d'une machine sans adresse
          # publique est injoignable depuis un centre de donnees GitHub, et
          # c'est precisement pour ca que le job de deploiement tourne
          # self-hosted.
          command -v kubectl >/dev/null \
            && echo "kubectl present, mais aucun kubeconfig vers todo-cluster" \
            || echo "meme pas de kubectl ici, et c'est normal"
