# Drop-in pose a la main, le 2026-08-06. L'unite generee par svc.sh est
# volontairement minimale ; ces trois reglages viennent de ce qu'on attend
# reellement de ce runner sur CETTE machine.
#
# NE PAS EDITER l'unite generee elle-meme : un `svc.sh uninstall` puis
# `svc.sh install` la reecrit entierement, et les corrections disparaitraient
# en silence. Un drop-in survit a cette reinstallation.

[Unit]
# `After=network-online.target` figure deja dans l'unite generee, mais un
# `After=` SEUL n'active pas la cible : sans `Wants=`, network-online n'est pas
# tiree dans la transaction de demarrage, et l'ordonnancement ne s'applique a
# rien. Les deux vont par paire, toujours.
Wants=network-online.target

# Le runner ne fait plus de SSH depuis le jour 4 : il parle a un cluster k3d
# qui vit dans des conteneurs Docker. Demarrer avant Docker donnerait un runner
# qui accepte des jobs qu'il ne peut pas executer — le job echouerait sur
# "The connection to the server was refused", au reboot, sans personne devant.
After=docker.service
Wants=docker.service

[Service]
# L'unite generee n'en avait AUCUN. `systemctl enable` couvre le redemarrage de
# la machine, pas le plantage du process : sans cette ligne, un runner mort
# reste mort, et les jobs repartent en `Queued` indefiniment sans message
# d'erreur — exactement la panne decrite au § 7 de la procedure, qu'on croyait
# reglee par le seul passage en service.
Restart=always
RestartSec=10
