# Les alertes de la flotte, declarees en fichier comme le reste.
#
# Deux alertes, pas quinze. Le sujet dit qu'on ne surveille pas pour surveiller,
# et une alerte qui se declenche tous les quarts d'heure est une alerte que
# personne ne regarde plus au moment ou elle compte vraiment.
apiVersion: 1

groups:
  - orgId: 1
    name: flotte
    folder: Flotte
    interval: 30s
    rules:
      - uid: service-injoignable
        title: Un service de la flotte ne repond plus
        condition: seuil
        # C'est la panne d'existence : le conteneur est mort, ou Prometheus ne
        # l'atteint plus. Elle precede toujours l'extinction d'un carre.
        data:
          - refId: mesure
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min by (service) (up{job="flotte"})
              instant: true
              refId: mesure
          - refId: seuil
            datasourceUid: __expr__
            model:
              type: threshold
              expression: mesure
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: seuil
        for: 30s
        labels: { gravite: critique }
        annotations:
          summary: "{{ $labels.service }} ne repond plus a Prometheus"
          description: "Panne d'existence. Regardez d'abord docker compose ps, puis les logs du service."

      - uid: dependance-tombee
        title: Une dependance de la flotte est tombee
        condition: seuil
        # Celle-ci distingue la panne 2 de la panne 6. Si un carre est eteint et
        # que cette alerte est SILENCIEUSE, la flotte va bien et c'est le chemin
        # vers le tableau qui est coupe.
        data:
          - refId: mesure
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min by (service, dependance) (dependance_disponible)
              instant: true
              refId: mesure
          - refId: seuil
            datasourceUid: __expr__
            model:
              type: threshold
              expression: mesure
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: seuil
        for: 30s
        labels: { gravite: importante }
        annotations:
          summary: "{{ $labels.service }} n'atteint plus {{ $labels.dependance }}"
          description: "Le service tourne mais ne peut plus travailler. Sa route de sante repond 503."
